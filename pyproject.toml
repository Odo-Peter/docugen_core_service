[project]
name = "docgen-service"
version = "0.1.0"
description = "Templated document generation API — structured JSON + a template in, a PDF out."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.1",
    "jsonschema>=4.26.0",
    "psycopg[binary]>=3.3.6",
    "python-ulid>=4.0.1",
    "scalar-fastapi>=1.9.1",
    "sqlalchemy>=2.1.1",
    "weasyprint>=70.0",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pre-commit",
    "pypdf>=5.0",
    "pytest-timeout>=2.3"
]

[tool.ruff]
# Match your desired line length
line-length = 140

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Ignore errors from third-party libraries that don't have type hints
ignore_missing_imports = true

# Enforce that all functions you write must have type hints
disallow_untyped_defs = true

# Be explicit about functions that can return any type
warn_return_any = true

# Treat the project root as the place where packages live
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "ruff>=0.12.2",
]
