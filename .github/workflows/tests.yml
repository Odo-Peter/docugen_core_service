name: Test Suite

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read
    issues: write
    pull-requests: write

jobs:
    tests:
        name: Run tests
        runs-on: ubuntu-latest

        env:
            DATABASE_URL: "postgresql+psycopg://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/docgen_test"
            TEST_DATABASE_URL: "postgresql+psycopg://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/docgen_test"

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Set up uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --extra dev

            - name: Run tests
              run: |
                  uv run --with pytest-html pytest tests/ \
                    --html=report.html \
                    --self-contained-html \
                    --junitxml=junit.xml

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports
                  path: |
                      report.html
                      junit.xml
                  if-no-files-found: warn
                  retention-days: 14

            - name: Comment test results on PR
              if: always() && github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');

                      const junitPath = 'junit.xml';
                      const runUrl =
                        `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const marker = '<!-- docgen-service-test-results -->';

                      let summary = '## Test Suite Results\n\n';

                      if (fs.existsSync(junitPath)) {
                        const xml = fs.readFileSync(junitPath, 'utf8');

                        const getCount = (attrs, name) => {
                          const match = attrs.match(
                            new RegExp(`(?:^|\\s)${name}="(\\d+)"`)
                          );
                          return match ? Number(match[1]) : 0;
                        };

                        // Prefer aggregate counts from the root <testsuites> element.
                        const rootMatch = xml.match(/<testsuites\b([^>]*)>/);
                        const rootAttrs = rootMatch ? rootMatch[1] : '';

                        let total = getCount(rootAttrs, 'tests');
                        let failures = getCount(rootAttrs, 'failures');
                        let errors = getCount(rootAttrs, 'errors');
                        let skipped = getCount(rootAttrs, 'skipped');

                        // Fall back to aggregating individual <testsuite> elements.
                        if (!/\btests="\d+"/.test(rootAttrs)) {
                          const suites = [...xml.matchAll(/<testsuite\b([^>]*)>/g)];

                          if (suites.length === 0) {
                            summary +=
                              '### Unable to parse test results\n\n' +
                              'The JUnit XML file contains no recognizable testsuite elements.\n\n';
                          } else {
                            total = 0;
                            failures = 0;
                            errors = 0;
                            skipped = 0;

                            for (const suite of suites) {
                              const attrs = suite[1];
                              total += getCount(attrs, 'tests');
                              failures += getCount(attrs, 'failures');
                              errors += getCount(attrs, 'errors');
                              skipped += getCount(attrs, 'skipped');
                            }
                          }
                        }

                        if (!summary.includes('Unable to parse test results')) {
                          const passed = Math.max(
                            0,
                            total - failures - errors - skipped
                          );

                          summary += '| Metric | Count |\n';
                          summary += '|---|---:|\n';
                          summary += `| Passed | ${passed} |\n`;
                          summary += `| Failed | ${failures} |\n`;
                          summary += `| Errors | ${errors} |\n`;
                          summary += `| Skipped | ${skipped} |\n`;
                          summary += `| Total | ${total} |\n\n`;

                          summary += total > 0 && failures === 0 && errors === 0
                            ? '### All tests passed\n\n'
                            : '### Tests failed or no tests were collected\n\n';
                        }
                      } else {
                        summary +=
                          '### Test results unavailable\n\n' +
                          'Pytest may have failed before producing its report.\n\n';
                      }

                      summary += `[View workflow run and reports](${runUrl})`;
                      summary = `${marker}\n${summary}`;

                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;

                      const { data: comments } =
                        await github.rest.issues.listComments({
                          owner,
                          repo,
                          issue_number,
                          per_page: 100
                        });

                      const existing = comments.find(
                        (comment) =>
                          comment.user.type === 'Bot' &&
                          comment.body.includes(marker)
                      );

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner,
                          repo,
                          comment_id: existing.id,
                          body: summary
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner,
                          repo,
                          issue_number,
                          body: summary
                        });
                      }
